<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>worktree-studio</title>
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#0b0f14" />
    <!-- Applies a stored light-theme choice before first paint (see
         theme.ts) — without this, the page would flash dark (tokens.css's
         default) and then repaint light a beat later, once main.tsx's own
         JS has loaded and run. Duplicated here rather than imported from
         theme.ts deliberately: this has to run synchronously, inline,
         before any CSS paints — importing a module would mean waiting on
         the module graph first. -->
    <script>
      if (localStorage.getItem("worktree-studio-theme") === "light") {
        document.documentElement.setAttribute("data-theme", "light");
      }
    </script>
    <!-- Command Deck's display/UI typefaces (Space Grotesk / Inter) — via
         Google Fonts CDN. Fully optional: every rule that uses them lists
         a real system-font fallback first in the stack, so working
         offline just means slightly-less-on-brand headings, not broken
         layout or missing text. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
