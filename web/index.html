<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>worktree-studio</title>
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#131517" />
    <!-- Resolves and applies the stored theme before first paint (see
         theme.ts for the storage keys and the family/mode model). Without
         this the page would paint the default palette and then repaint a
         beat later, once main.tsx's module graph has loaded — a visible
         flash on every reload. Duplicated here rather than imported from
         theme.ts deliberately: it has to run synchronously, inline,
         before any CSS paints, and an import means waiting on modules.
         Kept deliberately tiny and total — any failure falls through to
         the bare :root palette in tokens.css, which is itself complete. -->
    <script>
      (function () {
        var family = "graphite";
        var mode = "system";
        try {
          var f = localStorage.getItem("worktree-studio-theme-family");
          if (f === "graphite" || f === "ledger" || f === "deck") family = f;
          var m = localStorage.getItem("worktree-studio-theme-mode");
          if (m === "dark" || m === "light" || m === "system") {
            mode = m;
          } else {
            // Pre-redesign key: keep the light/dark an existing install chose.
            var legacy = localStorage.getItem("worktree-studio-theme");
            if (legacy === "light" || legacy === "dark") mode = legacy;
          }
        } catch (e) {}
        if (mode === "system") {
          mode =
            window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches
              ? "light"
              : "dark";
        }
        document.documentElement.setAttribute("data-theme", family);
        document.documentElement.setAttribute("data-mode", mode);
      })();
    </script>
    <!-- The one UI typeface. There is no display face any more: headings
         take their hierarchy from the type scale in tokens.css, which is
         one less font to load and one less voice competing with the
         terminal. Fully optional either way — --font-ui lists a real
         system-font fallback first, so offline means slightly-off-brand
         chrome, not broken layout. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
